<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="신지엽의 개인 페이지. 비즈니스, 투자, 그리고 AI를 배우고 연결합니다.">
  <meta name="color-scheme" content="light">
  <title>신지엽 · Jiyeop Shin</title>
  <style>
    :root{--bg:#f5f4ef;--ink:#1d2420;--muted:#626a63;--line:#d8dcd3;--accent:#386343}
    *{box-sizing:border-box}
    body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;line-height:1.75;word-break:keep-all}
    a{color:inherit;text-decoration:none}
    a:focus-visible{outline:3px solid var(--accent);outline-offset:5px}
    .wrap{max-width:1040px;margin:auto;padding:0 48px}
    header{display:flex;align-items:center;justify-content:space-between;padding:28px 0;border-bottom:1px solid var(--line);gap:20px}
    .mark{font-size:18px;font-weight:750;letter-spacing:-.05em}
    .small{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
    .hero{display:grid;grid-template-columns:1.5fr 1fr;align-items:center;gap:48px;padding:76px 0 64px}
    .eyebrow{margin:0 0 22px;font-size:12px;letter-spacing:.12em;color:var(--accent);font-weight:700}
    h1{margin:0;font-size:clamp(44px,7vw,68px);font-weight:700;letter-spacing:-.055em;line-height:1.25}
    .english{display:block;margin-top:12px;font-size:21px;font-weight:400;letter-spacing:-.02em;color:var(--muted)}
    .intro{margin:28px 0 0;max-width:440px;font-size:16px;line-height:1.95;color:#465047}
    .art{aspect-ratio:1;background:#e5e9df;border-radius:50% 50% 8px 8px;display:grid;place-items:center;overflow:hidden}
    .art svg{width:86%;height:86%}
    .section{border-top:1px solid var(--line);padding:28px 0 35px;display:grid;grid-template-columns:180px 1fr;gap:32px}
    h2{font-size:12px;letter-spacing:.1em;text-transform:uppercase;margin:3px 0;color:var(--muted);font-weight:600}
    .interests{display:flex;flex-wrap:wrap;gap:10px}
    .interest{border:1px solid #cbd3c5;border-radius:24px;padding:6px 15px;font-size:14px}
    .links{display:flex;flex-wrap:wrap;gap:24px}
    .links a{border-bottom:1px solid var(--ink);padding-bottom:3px;font-size:15px}
    .links a:hover{color:var(--accent);border-color:var(--accent)}
    footer{padding:26px 0 32px;border-top:1px solid var(--line);font-size:12px;color:var(--muted)}
    @media(max-width:640px){.wrap{padding:0 24px}header{padding:22px 0}.small{font-size:10px;letter-spacing:.06em}.hero{grid-template-columns:1fr;gap:32px;padding:42px 0}.intro{font-size:15px;margin-top:24px}.art{width:min(100%,260px);justify-self:center}.section{grid-template-columns:1fr;gap:16px;padding:24px 0}.english{font-size:20px}.eyebrow{margin-bottom:18px}}
    @media(prefers-reduced-motion:no-preference){a{transition:color .15s}}
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <a class="mark" href="#main" aria-label="본문으로 이동">J. SHIN</a>
      <span class="small">A personal page</span>
    </header>
    <main id="main">
      <section class="hero" aria-labelledby="name">
        <div>
          <p class="eyebrow">BUSINESS · INVESTMENT · AI</p>
          <h1 id="name">신지엽<span class="english" lang="en">Jiyeop Shin</span></h1>
          <p class="intro">기업을 이해하고 투자하는 일을 합니다.<br>AI를 배우며, 아이디어를 직접 만들어 보고 있습니다.<br>작지만 실제로 쓰이는 서비스를 만들고 싶습니다.</p>
        </div>
        <div class="art">
          <svg viewBox="0 0 300 300" role="img" aria-labelledby="art-title">
            <title id="art-title">배움과 연결을 표현한 추상 일러스트</title>
            <circle cx="151" cy="150" r="104" fill="none" stroke="#b7c3ad" stroke-width="1"/>
            <circle cx="151" cy="150" r="69" fill="none" stroke="#b7c3ad" stroke-width="1"/>
            <path d="M67 211 150 76 235 210Z" fill="none" stroke="#386343" stroke-width="2"/>
            <path d="M67 211 151 150 235 210M150 76 151 150" fill="none" stroke="#386343" stroke-width="2"/>
            <circle cx="150" cy="76" r="18" fill="#386343"/>
            <circle cx="67" cy="211" r="18" fill="#9cac8b"/>
            <circle cx="235" cy="210" r="18" fill="#657958"/>
            <circle cx="151" cy="150" r="10" fill="#f5f4ef" stroke="#386343" stroke-width="2"/>
          </svg>
        </div>
      </section>
      <section class="section" aria-labelledby="interests-title">
        <h2 id="interests-title">관심 있는 것</h2>
        <div class="interests"><span class="interest">기업과 사업모델</span><span class="interest">AI의 실무 활용</span><span class="interest">서비스 만들기</span></div>
      </section>
      <section class="section" aria-labelledby="links-title">
        <h2 id="links-title">연결하기</h2>
        <div class="links"><a href="https://github.com/jshin115">GitHub ↗</a></div>
      </section>
    </main>
    <footer>© 2026 Jiyeop Shin</footer>
  </div>
</body>
</html>
